<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research Dashboard — Participant</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-topbar">
    <div class="brand">
      <span class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2a3.5 3.5 0 0 0-3.5 3.5V6a3 3 0 0 0-2 5.24 3 3 0 0 0 1.17 5.48A3.5 3.5 0 0 0 8.5 21c.35 0 .69-.05 1-.15"/><path d="M14.5 2a3.5 3.5 0 0 1 3.5 3.5V6a3 3 0 0 1 2 5.24 3 3 0 0 1-1.17 5.48A3.5 3.5 0 0 1 15.5 21c-.35 0-.69-.05-1-.15"/><path d="M9.5 2v18.85M14.5 2v18.85"/></svg>
      </span>
      <div>
        <h1>Cognitive Speech Research</h1>
        <p>Admin Dashboard</p>
      </div>
    </div>
    <div class="identity-block">
      <span class="identity-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <div class="identity-text">
        <span class="name">Admin</span>
        <span class="sub">Research Only</span>
      </div>
    </div>
  </div>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <nav>
        <a class="nav-item active" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Participants</span>
        </a>
        <a class="nav-item" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>
          <span>Session Review</span>
        </a>
      </nav>
    </aside>

    <main class="admin-content">
      <a class="back-link" href="index.html">&larr; Back to Participants</a>
      <p class="eyebrow">Participant</p>
      <h2 id="participantHeading" class="page-title mono">—</h2>

      <div class="stat-row" id="statRow"></div>

      <p class="eyebrow" style="margin-top: 24px;">Sessions</p>
      <div id="sessionsList"></div>
      <p class="status-line" id="statusLine"></p>
    </main>
  </div>

  <script type="module" src="../js/admin/participantProfile.js"></script>
</body>
</html>
